name: CI

# Separate from release.yml deliberately: that workflow's jobs are all
# electron-builder packaging (three OSes, several minutes each, and on `main`
# they only run when release-please actually tagged a release). The engine's
# own test suite is fixture-based and runs in about a second, so gating PRs on
# it here gives a fast, precise signal long before the packaging matrix
# finishes — rather than the current state, where packaging is the only thing
# a required status check can point at.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Matches the version release.yml builds with, so a type error that
          # only appears on the release runner's Node can't slip past here.
          node-version: '24'
          cache: 'npm'

      # `--workspaces=false --include-workspace-root` installs the engine's own
      # dependencies only. A plain `npm ci` would also install the electron
      # workspace, whose postinstall downloads the ~100MB Electron binary —
      # pure cost for this job, since nothing below launches the app. The
      # Electron-specific test (electron/test/mcpServerMode.mjs) needs that
      # binary and a display server, so it doesn't belong here.
      #
      # release.yml's build-pr/release jobs run electron-builder but never
      # invoke electron/test/mcpServerMode.mjs either — that's the separate
      # electron-mcp-server job below, which does the full install this one
      # deliberately skips.
      - name: Install dependencies
        run: npm ci --workspaces=false --include-workspace-root

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # Runs the one check neither the `test` job above (engine-only install, no
  # Electron binary) nor release.yml (packages but never invokes this script)
  # covers: that the packaged app's --mcp-server mode actually boots and lists
  # the full expected tool set. Split into its own job (rather than folded
  # into `test`) so its slower full-workspace install + system deps don't
  # block the fast fixture-based signal above. Tracked in #97.
  electron-mcp-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # Full workspace install (unlike the `test` job's --workspaces=false) —
      # this job needs the real Electron binary that install skips.
      - name: Install dependencies
        run: npm ci

      # `npm ci` alone does NOT fetch the Electron binary — the `electron`
      # package's own postinstall only writes a path.txt; the ~100MB binary is
      # fetched lazily, synchronously, the first time something does
      # `require('electron')` (see node_modules/electron/index.js). Forcing
      # that here, in a plain unwrapped step, means any download slowness or
      # failure shows up on its own rather than three shells deep inside the
      # dbus-run-session/xvfb-run wrapping below, where a hang and buffered-
      # but-actually-fine output look identical from the log.
      - name: Pre-fetch Electron binary
        working-directory: electron
        run: node -e "require('electron')"

      # Electron needs a display even in --mcp-server mode, where no window is
      # ever shown. safeStorage's Linux backend also needs a running Secret
      # Service (gnome-keyring here) to encrypt/decrypt the seeded connection —
      # without one, isEncryptionAvailable() is false and the seed step fails.
      - name: Install Electron runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 gnome-keyring \
            libnss3 libgbm1 libasound2t64 libgtk-3-0 libxss1 libxkbcommon0 \
            libatk-bridge2.0-0 libcups2 libdrm2

      # Xvfb gives Electron a display; gnome-keyring-daemon gives safeStorage a
      # Secret Service. Both started directly rather than through the
      # xvfb-run/dbus-run-session wrapper scripts: an earlier attempt hung
      # indefinitely inside xvfb-run's own X-server-readiness wait, before it
      # ever got to exec anything — confirmed because the runner's orphan-
      # process cleanup showed xvfb-run and Xvfb had started but neither
      # gnome-keyring-daemon nor node ever did. Starting each primitive
      # ourselves removes that wrapper-script layer entirely.
      #
      # The keyring daemon's env output is redirected to a file and sourced,
      # NOT captured via `$(...)`: it forks a persistent child that inherits
      # the stdout pipe, so command substitution never sees EOF and hangs
      # forever waiting for output that already arrived. `dbus-launch` (unlike
      # dbus-run-session) forks dbus-daemon into the background and returns
      # immediately, so capturing its two export lines via `$(...)` is safe.
      #
      # ELECTRON_DISABLE_SANDBOX: the npm-installed Electron binary's
      # chrome-sandbox helper isn't root-owned/setuid here (unlike a real
      # package install), so Chromium's SUID sandbox refuses to run rather
      # than silently proceed unsandboxed. This is CI-only — it doesn't affect
      # how the packaged app (built by release.yml/electron-builder) runs for
      # end users.
      - name: Run mcpServerMode integration test
        working-directory: electron
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: |
          echo "::group::Xvfb"
          Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99
          sleep 2
          echo "Xvfb started, DISPLAY=$DISPLAY"
          echo "::endgroup::"

          echo "::group::dbus-launch"
          eval "$(dbus-launch --sh-syntax)"
          echo "dbus-launch done: DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
          echo "::endgroup::"

          echo "::group::gnome-keyring-daemon"
          printf "\n" | gnome-keyring-daemon --unlock --components=secrets > /tmp/keyring-env.sh
          echo "gnome-keyring-daemon done, wrote:"
          cat /tmp/keyring-env.sh
          source /tmp/keyring-env.sh
          echo "::endgroup::"

          echo "::group::node test/mcpServerMode.mjs"
          node test/mcpServerMode.mjs
          echo "node exited $?"
          echo "::endgroup::"
