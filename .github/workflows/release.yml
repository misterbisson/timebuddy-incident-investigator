name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Manual recovery path: rebuild and (re-)publish the installers for an
  # already-tagged, already-published release whose assets are missing or need
  # replacing — e.g. the 0.2.0–0.4.0 releases that shipped with no installers
  # because electron-builder's default draft publish type was incompatible with
  # release-please's published release (fixed by build.publish.releaseType in
  # electron/package.json). See the `republish` job below.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build and publish assets for, e.g. v0.4.0'
        required: true
        type: string

jobs:
  version:
    # release-please (release-please-config.json / .release-please-manifest.json)
    # maintains a single accumulating "chore(release): X.Y.Z" PR of every
    # unreleased feat/fix/breaking commit since the last tag (including
    # Dependabot's fix(deps)/fix(deps-dev) bumps) — nothing is published here.
    # Merging that PR through the normal required-status-checks path is what
    # actually cuts a release: release-please tags vX.Y.Z on the merge commit,
    # which is what the release job below builds and publishes from. This
    # (rather than a direct push to main) is required because main's branch
    # protection has no bypass for direct pushes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    # release-please (above) creates the vX.Y.Z tag AND the GitHub release when
    # the "chore(release)" PR merges; electron-builder here uploads the installers
    # to that existing release. This only runs once `version` has bumped and
    # tagged a real release (release_created == true), and builds against that tag
    # rather than the commit that triggered the workflow (which is one behind it
    # after the version bump).
    #
    # NOTE: the tag and the GitHub release are created together by release-please;
    # do NOT set skip-github-release on the version job — it skips the tag too,
    # leaving release_created empty (so this job never runs) and the merged
    # release PR untagged (which makes every later release-please run abort with
    # "untagged, merged release PRs outstanding").
    needs: version
    if: needs.version.outputs.published == 'true'
    permissions:
      contents: write

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Publish
        working-directory: electron
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            npm run build-mac -- --publish always
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            npm run build-win -- --publish always
          else
            npm run build-linux -- --publish always
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Native electron-builder signing: it imports this base64 Developer ID
          # .p12 into its own throwaway keychain and signs the app inside-out
          # (helpers + frameworks with inherited entitlements + hardened runtime +
          # secure timestamp) — the manual `codesign --deep` approach could not.
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          # Notarization (config: mac.notarize in package.json) + auto-staple.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Bump Homebrew cask
        # Runs only on the macOS leg — the only one that just produced the two
        # dmg's the cask serves (arm64 + x64). Hashes those local files directly
        # rather than re-downloading from the release that was just published
        # (same bytes, one less round-trip and one less thing that could 404 on
        # a slow CDN propagation), then pushes the version + sha256 bump
        # straight to misterbisson/homebrew-timebuddy's main branch — a
        # single-maintainer tap with no branch protection, so no PR round-trip
        # is needed there either. Requires HOMEBREW_TAP_TOKEN: a fine-grained
        # PAT scoped to Contents: read/write on that one repo only (the default
        # GITHUB_TOKEN above is scoped to this repo and can't push elsewhere).
        if: matrix.os == 'macos-latest'
        working-directory: electron/dist
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          ARM_SHA=$(shasum -a 256 "Timebuddy-Incident-Investigator-${VERSION}-arm64.dmg" | awk '{print $1}')
          INTEL_SHA=$(shasum -a 256 "Timebuddy-Incident-Investigator-${VERSION}-x64.dmg" | awk '{print $1}')

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/misterbisson/homebrew-timebuddy.git" tap
          cd tap

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/timebuddy.rb
          sed -i '' "s/arm:   \".*\"/arm:   \"${ARM_SHA}\",/" Casks/timebuddy.rb
          sed -i '' "s/intel: \".*\"/intel: \"${INTEL_SHA}\"/" Casks/timebuddy.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/timebuddy.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date, nothing to commit."
          else
            git commit -m "chore: bump timebuddy cask to ${VERSION}"
            git push origin HEAD:main
          fi

  republish:
    # Manual recovery job (workflow_dispatch, `tag` input). Rebuilds and uploads
    # the installers for an existing, already-published release whose assets are
    # missing. Mirrors the `release` job's signing + build steps, but checks out
    # the requested tag, builds with `--publish never`, and uploads the artifacts
    # with `gh release upload`. It deliberately does NOT use electron-builder's
    # own publisher: for an old release, electron-builder refuses to publish
    # ("existing release published more than 2 hours ago") as a guard against
    # clobbering a shipped release — exactly the case when backfilling. `gh
    # release upload` has no such guard, so it works for any tag (0.2.0–0.4.0)
    # regardless of age or how the release was created.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (no publish)
        working-directory: electron
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            npm run build-mac -- --publish never
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            npm run build-win -- --publish never
          else
            npm run build-linux -- --publish never
          fi
        shell: bash
        env:
          # Native electron-builder signing + notarization (same as the release
          # job), so backfilled installers match what a fresh release produces.
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Upload the built installers (+ blockmaps + electron-updater metadata) to
      # the existing release via the gh CLI, which — unlike electron-builder's
      # publisher — has no draft/age guard. The three platforms write distinct
      # metadata files (latest.yml / latest-mac.yml / latest-linux.yml), so
      # parallel matrix uploads to the same release don't collide. --clobber makes
      # re-runs idempotent.
      - name: Upload assets to release
        working-directory: electron/dist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            # *.zip / *.zip.blockmap are load-bearing: latest-mac.yml points at
            # the zip (electron-updater's Squirrel.Mac path only consumes a zip,
            # not the dmg), so omitting them here would republish a manifest
            # referencing assets that aren't in the release — 404 on every mac
            # auto-update. The dmg stays for first-install downloads.
            files=(*.dmg *.dmg.blockmap *.zip *.zip.blockmap latest-mac.yml)
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            files=(*.exe *.exe.blockmap latest.yml)
          else
            files=(*.AppImage latest-linux.yml)
          fi
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No build artifacts found to upload for ${{ matrix.os }}"
            exit 1
          fi
          echo "Uploading to ${{ inputs.tag }}: ${files[*]}"
          gh release upload "${{ inputs.tag }}" "${files[@]}" \
            --repo "${{ github.repository }}" --clobber

  build-pr:
    if: github.event_name == 'pull_request'

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (PR test, unsigned)
        working-directory: electron
        run: |
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            npm run build-mac -- --publish=never
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            npm run build-win -- --publish=never
          else
            npm run build-linux -- --publish=never
          fi
        shell: bash
