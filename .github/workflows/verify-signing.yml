name: Verify macOS Signing

# Clean-room end-to-end check that the macOS build is genuinely Developer-ID
# signed, notarized, and stapled — the exact release signing path (electron-builder
# native sign + notarize + staple) minus the publish step. Runs on a fresh runner
# so it can't be fooled by a developer machine's cached intermediates or
# pre-trusted keychain. Also uploads the signed .dmg so a human can verify the real
# Gatekeeper open experience on a clean Mac.
#
# Same-repo PRs get repo secrets; fork PRs do not (MACOS_CERTIFICATE would be
# empty and the fail-fast step below trips) — that's intended, signing can't be
# verified from a fork anyway.
#
# Dependabot PRs are the case that bites, and they are NOT forks: a
# Dependabot-triggered `pull_request` event runs with the `dependabot` secrets
# scope, so MACOS_CERTIFICATE is empty and this job fails on every one of them,
# structurally, no matter how healthy the bump is. This job is not a required
# check (see main's protection: `test` plus the three `build-pr` jobs), so it
# doesn't block the merge — but it does mean a dependency bump that breaks
# signing looks identical to one that doesn't.
#
# That's why `push: branches: [main]` is here. It costs one notary run per merge
# to main, and buys a real signing signal on the merged tree within minutes of
# the merge rather than at the next release. It's the gap that let electron 43 →
# 44 (#229) reach main with signing verified only by a manual `workflow_dispatch`
# against the PR branch — which worked, but only because someone thought to run
# it. For a Dependabot PR specifically, that dispatch is still the way to get the
# signal BEFORE merging:
#     gh workflow run verify-signing.yml --ref <dependabot-branch>
# A workflow_dispatch run does get repo secrets.

on:
  workflow_dispatch:
  # Post-merge safety net for the PRs this job can't check pre-merge (see the
  # Dependabot note above). Unpathed on purpose: `push` runs are the backstop,
  # and a path filter here would reintroduce the same blind spot for any file
  # combination the pull_request filter below doesn't anticipate.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # Only when something that affects the built/signed app changes — not docs
    # (electron/*.md) or tests, so a docs-only PR doesn't burn a macOS notary run.
    paths:
      - 'electron/src/**'
      - 'electron/renderer/**'
      - 'electron/scripts/**'
      - 'electron/build/**'
      - 'electron/package.json'
      - '.github/workflows/verify-signing.yml'

concurrency:
  # Keyed on event_name as well as ref now that `push` is a trigger: on a merge
  # to main both a push run and (briefly) the PR's run can be in flight, and a
  # bare ref key would have one cancel the other — losing exactly the signal
  # this job exists to produce.
  group: verify-signing-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-macos-signing:
    runs-on: macos-latest
    # Notarization-bound like release.yml's `release` job, ~7min typical, so the
    # cap leaves room for a slow notary rather than tracking the median.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fail fast if signing secret is unavailable (e.g. fork PR)
        run: |
          if [[ -z "${{ secrets.MACOS_CERTIFICATE }}" ]]; then
            echo "::error::MACOS_CERTIFICATE is empty — signing cannot be verified (fork PR?)"
            exit 1
          fi

      - name: Build, sign, notarize, staple (no publish)
        working-directory: electron
        run: npm run build-mac -- --publish never
        shell: bash
        env:
          # Native electron-builder signing (imports CSC_LINK into its own
          # keychain, signs inside-out) + notarization (mac.notarize in
          # package.json) + auto-staple. CSC_FOR_PULL_REQUEST forces signing here:
          # electron-builder skips signing on pull_request builds by default.
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          CSC_FOR_PULL_REQUEST: "true"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Assert signed + hardened + timestamped + notarized + stapled
        shell: bash
        run: |
          set -uo pipefail
          TEAM_ID="4HBULGLS48"
          shopt -s nullglob
          apps=(electron/dist/mac*/*.app)
          if [[ ${#apps[@]} -eq 0 ]]; then
            echo "::error::no .app produced under electron/dist"; exit 1
          fi
          fail=0
          for app in "${apps[@]}"; do
            echo "==================================================================="
            echo "Verifying: $app"
            info=$(codesign -dvvv "$app" 2>&1)
            echo "$info"
            echo "------ assertions ------"
            grep -q "Authority=Developer ID Application:.*(${TEAM_ID})" <<<"$info" \
              && echo "PASS  signed by Developer ID ($TEAM_ID)" \
              || { echo "FAIL  not signed by expected Developer ID"; fail=1; }
            grep -q "TeamIdentifier=${TEAM_ID}" <<<"$info" \
              && echo "PASS  TeamIdentifier=$TEAM_ID" \
              || { echo "FAIL  wrong/absent TeamIdentifier"; fail=1; }
            grep -qE "flags=.*runtime" <<<"$info" \
              && echo "PASS  hardened runtime" \
              || { echo "FAIL  hardened-runtime flag absent"; fail=1; }
            grep -q "^Timestamp=" <<<"$info" \
              && echo "PASS  secure timestamp present" \
              || { echo "FAIL  no secure timestamp (is --timestamp being passed?)"; fail=1; }

            codesign --verify --deep --strict --verbose=2 "$app" \
              && echo "PASS  signature verifies (--deep --strict)" \
              || { echo "FAIL  signature verification failed"; fail=1; }

            spctl -a -t exec -vvv "$app" 2>/tmp/spctl.txt; cat /tmp/spctl.txt
            grep -q "accepted" /tmp/spctl.txt \
              && echo "PASS  Gatekeeper accepts" \
              || { echo "FAIL  Gatekeeper did not accept"; fail=1; }
            grep -q "source=Notarized Developer ID" /tmp/spctl.txt \
              && echo "PASS  notarized" \
              || { echo "FAIL  not notarized"; fail=1; }

            xcrun stapler validate "$app" \
              && echo "PASS  notarization ticket stapled" \
              || { echo "FAIL  no stapled ticket"; fail=1; }
          done
          if [[ $fail -ne 0 ]]; then
            echo "::error::macOS signing/notarization verification FAILED"; exit 1
          fi
          echo "All macOS signing / notarization / stapling checks passed."

      - name: Upload signed installers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-signed-dmg
          path: |
            electron/dist/*.dmg
            electron/dist/*.dmg.blockmap
          if-no-files-found: warn
          retention-days: 7
